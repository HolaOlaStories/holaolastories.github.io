bilingualHeading: "Un cuento - varios idiomas"
bilingualIntro: "Los cuentos de Kaio están disponibles en varios idiomas, y con el tiempo se sumarán nuevos episodios y versiones en otros idiomas. Cada versión cuenta la misma historia y conserva el número y el orden de los párrafos del original. Las traducciones mantienen el sentido del original con un lenguaje natural. La música y los efectos de sonido acompañan las mismas escenas, lo que puede ayudar a los niños a relacionar lo que ya conocen de la historia con las palabras y las frases del otro idioma."
bilingualStepsIntro: "Una forma de escuchar:"
bilingualSteps:
  - "Primero el episodio completo en el idioma que el niño entiende mejor, para que siga la historia."
  - "Después el mismo episodio en el otro idioma, al día siguiente o en el auto."
  - "En los días siguientes, el mismo episodio otra vez en el idioma que el niño conoce menos, o solo una escena."
namesNote: "Pueden comparar cómo se escribe y se pronuncia el nombre de Kaio en el otro idioma."
factsNote: "Los datos curiosos al final del episodio son una oportunidad para comparar cómo se llama el animal en los dos idiomas elegidos, por ejemplo, ballena - whale."

creatorsHeading: "Quiénes crean las historias de Kaio"
creators:
  - "Me llamo Jakub Leśniak. Escribo los cuentos de Kaio y Ola Stalmach los narra. La historia de Kaio nació para acompañar a nuestro hijo Kajetan a la hora de dormir, durante largas veladas en lejanas islas de Tailandia."
  - "Soy arquitecto y músico, y Ola es ingeniera. En nuestro trabajo diario creamos escenas y efectos especiales para películas y proyectos de arquitectura. Los cuentos de Kaio nacieron de la pasión, del amor por los niños y de las ganas de crear para ellos algo que los atrapara, los inspirara y les enseñara algo. Nuestro hijo escucha muchos audiocuentos y sabemos lo mucho que aportan a su desarrollo y a su imaginación."
  - "Hemos viajado mucho por Asia, Sudamérica y Europa, y seguimos haciéndolo. Vivimos un tiempo en Chequia y en España, y ahora vivimos en Polonia. Estas experiencias nos ayudan a comprender mejor a los padres cuyos hijos crecen en un entorno multilingüe."
voice: "Los episodios en polaco los lee Ola. Las versiones en otros idiomas se hicieron con un clon de su voz."
friendsAlt: "Kaio y sus amigos de la serie sobre el lomo de la ballena Hugo, bajo un cielo estrellado: un koala, un elefante, una jirafa, un mono, un oso polar y un gato. Sobre ellos vuelan un loro y una cigüeña."

