bilingualHeading: "एक कहानी - कई भाषाएँ"
bilingualIntro: "कायो की कहानियाँ कई भाषाओं में उपलब्ध हैं। समय के साथ नए एपिसोड आएँगे और कहानियाँ और भी भाषाओं में उपलब्ध होंगी। हर भाषा में कहानी वही रहती है और उसके अनुच्छेदों की संख्या और क्रम भी वही रहते हैं। अनुवाद में मूल कहानी का अर्थ बरकरार रखते हुए सहज भाषा का इस्तेमाल किया जाता है। हर संस्करण में संगीत और ध्वनि प्रभाव कहानी के उन्हीं दृश्यों के साथ आते हैं। इससे बच्चे को जानी-पहचानी घटनाओं को दूसरी भाषा के शब्दों और वाक्यों से जोड़ने में मदद मिल सकती है।"
bilingualStepsIntro: "सुनने का एक तरीका:"
bilingualSteps:
  - "पहले पूरा एपिसोड उस भाषा में, जिसे बच्चा बेहतर समझता है, ताकि वह कहानी समझ सके।"
  - "फिर वही एपिसोड दूसरी भाषा में, अगले दिन या गाड़ी में।"
  - "अगले कुछ दिनों में वही एपिसोड उस भाषा में दोबारा सुनाएँ, जिसे बच्चा कम समझता है, या सिर्फ़ कोई एक दृश्य चुनें।"
namesNote: "यह भी देखें कि दूसरी भाषा में कायो का नाम कैसे लिखा और बोला जाता है।"
factsNote: "एपिसोड के अंत में जानवरों के बारे में मज़ेदार जानकारी सुनते समय, चुनी हुई दोनों भाषाओं में उस जानवर के नाम की तुलना भी करें। जैसे: व्हेल - whale।"

creatorsHeading: "कायो की कहानियाँ कौन बनाते हैं?"
creators:
  - "मेरा नाम याकुब लेश्न्याक है। मैं कायो की कहानियाँ लिखता हूँ और ओला स्तालमाख उन्हें सुनाती हैं। कायो की कहानी की शुरुआत थाईलैंड के दूर-दराज़ के द्वीपों पर लंबी शामों के दौरान हुई। यह हमारे बेटे कायेतान के लिए सोने से पहले सुनने वाली कहानी थी।"
  - "मैं आर्किटेक्ट और संगीतकार हूँ, और ओला इंजीनियर हैं। अपने रोज़ के काम में हम फ़िल्मों और वास्तुकला से जुड़ी परियोजनाओं के लिए दृश्य और स्पेशल इफ़ेक्ट्स बनाते हैं। कायो की कहानियाँ हमारे शौक़, बच्चों के प्रति प्यार और उनके लिए कुछ ऐसा बनाने की चाह से जन्मीं, जो उन्हें बाँध ले, प्रेरित करे और कुछ सिखाए। हमारा बेटा बहुत सारी ऑडियो कहानियाँ सुनता है, और हम जानते हैं कि इनका उसके विकास और कल्पनाशक्ति पर कितना अच्छा असर पड़ता है।"
  - "हमने एशिया, दक्षिण अमेरिका और यूरोप में बहुत सफ़र किया है और अब भी करते हैं। हम चेक गणराज्य और स्पेन में रह चुके हैं और अब पोलैंड में रहते हैं। इन अनुभवों से हमें उन माता-पिता को बेहतर समझने में मदद मिलती है, जिनके बच्चे बहुभाषी माहौल में बड़े हो रहे हैं।"
voice: "पोलिश एपिसोड ओला ख़ुद पढ़ती हैं। दूसरी भाषाओं के संस्करण उनकी आवाज़ के क्लोन से बनाए गए हैं।"
friendsAlt: "तारों भरे आसमान के नीचे कायो और उसके दोस्त व्हेल हूगो की पीठ पर हैं: कोआला, हाथी, ज़िराफ़, बंदर, ध्रुवीय भालू और बिल्ली। उनके ऊपर एक तोता और एक सारस उड़ रहे हैं।"

contactHeading: "माता-पिता, स्कूलों और पुस्तकालयों के लिए"
contactText: "एपिसोड के लिंक माता-पिता, शिक्षकों और लाइब्रेरियन के साथ बेझिझक साझा करें। अगर आप दो भाषाएँ सीखने या बोलने वाले बच्चों के लिए गतिविधियाँ आयोजित करते हैं या बच्चों की कहानियों के बारे में लिखते हैं, तो हमें लिखें।"
