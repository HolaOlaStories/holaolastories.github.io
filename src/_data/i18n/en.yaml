bilingualHeading: "One story - many languages"
bilingualIntro: "Kayo's stories are available in several languages, with more episodes and language versions to come. Each version tells the same story and keeps the original number and order of paragraphs. The translations preserve the meaning of the original while using natural language. The music and sound effects accompany the same scenes, which may help children connect familiar events with words and sentences in the other language."
bilingualStepsIntro: "One way to listen:"
bilingualSteps:
  - "First the whole episode in the language the child understands better, so they can follow the story."
  - "Then the same episode in the other language, the next day or on a car ride."
  - "Over the following days, the same episode again in the language the child is less familiar with, or just one chosen scene."
namesNote: "Compare how Kayo's name is written and pronounced in the other language."
factsNote: "The animal facts at the end of the episode are a chance to compare the word for the animal in your chosen pair of languages, for example, whale - wieloryb."

creatorsHeading: "Who creates Kayo's stories"
creators:
  - "My name is Jakub Leśniak. I write the Kayo stories, and Ola Stalmach narrates them. Kayo's story began as a bedtime tale for our son Kajetan during long evenings on faraway islands in Thailand."
  - "I'm an architect and a musician, and Ola is an engineer. In our day-to-day work, we create scenes and special effects for films and architectural projects. Kayo's stories grew out of our passion, our love for children and our wish to create something that would draw them in, inspire them and teach them something. Our son listens to a lot of audio stories, and we know how good they are for his development and imagination."
  - "We have travelled a lot across Asia, South America and Europe, and we still do. We have lived in the Czech Republic and Spain, and now we live in Poland. These experiences help us better understand parents whose children are growing up in a multilingual environment."
voice: "Ola reads the Polish episodes. The versions in other languages were made with a clone of her voice."
friendsAlt: "Kayo and his friends from the series on Hugo the whale's back under a starry sky: a koala, an elephant, a giraffe, a snow monkey, a polar bear and a cat. A parrot and a stork fly above them."

