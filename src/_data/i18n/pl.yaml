bilingualHeading: "Jedna opowieść - różne języki"
bilingualIntro: "Bajki o Kaju powstają w różnych językach. Z czasem będą pojawiać się kolejne odcinki i wersje językowe. W każdym języku opowiadamy tę samą historię, zachowując liczbę i kolejność akapitów. Tłumaczenia oddają sens oryginału w sposób naturalny dla danego języka. Muzyka i efekty dźwiękowe towarzyszą tym samym scenom, co może pomóc dziecku powiązać znane wydarzenia ze słowami i zdaniami w drugim języku."
bilingualStepsIntro: "Proponujemy taki sposób słuchania:"
bilingualSteps:
  - "Najpierw cały odcinek w języku, który dziecko rozumie lepiej. Wie wtedy, o czym jest historia."
  - "Potem ten sam odcinek w drugim języku, na przykład następnego dnia albo w samochodzie."
  - "W kolejnych dniach jeszcze raz ten sam odcinek w języku, który dziecko zna słabiej, albo tylko wybrana scena."
namesNote: "Zwróćcie też uwagę na zapis i wymowę imienia Kaja w drugim języku."
factsNote: "Ciekawostki na końcu odcinka to okazja, żeby porównać nazwę zwierzęcia w wybranej parze języków, np. wieloryb - whale."

creatorsHeading: "Kto tworzy Kaja"
creators:
  - "Nazywam się Jakub Leśniak. Piszę bajki o Kaju, a opowiada je Ola Stalmach. Kajo powstał jako bajka na dobranoc dla naszego synka Kajetana podczas długich wieczorów na dalekich wyspach Tajlandii."
  - "Jestem architektem i muzykiem, a Ola inżynierem. Na co dzień razem tworzymy sceny i efekty specjalne na potrzeby filmów i projektów architektonicznych. Bajki o Kaju powstały z pasji, z miłości do dzieci i z chęci stworzenia dla nich czegoś, co je pochłonie, zainspiruje i czegoś nauczy. Nasz synek słucha bardzo dużo audiobajek i wiemy, jak dobrze wpływa to na jego rozwój i wyobraźnię."
  - "Dużo podróżowaliśmy i nadal podróżujemy po Azji, Ameryce Południowej i Europie. Mieszkaliśmy w Czechach i Hiszpanii, a teraz mieszkamy w Polsce. Te doświadczenia pomagają nam lepiej rozumieć rodziców, których dzieci dorastają w wielojęzycznym otoczeniu."
voice: "Polskie odcinki czyta Ola, a wersje obcojęzyczne powstały przy użyciu klonu jej głosu."
friendsAlt: "Kajo i przyjaciele z serii na grzbiecie wieloryba Hugo pod rozgwieżdżonym niebem: koala, słoń, żyrafa, małpka, niedźwiedź polarny i kot. Nad nimi lecą papuga i bocian."

