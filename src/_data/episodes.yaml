# Stan danych: ID YouTube sprawdzone 31.10.2026 przez oEmbed YouTube (każdy film na właściwym kanale),
# Spotify odczytane 31.10.2026 ze stron pokazów, Apple i czasy z API Apple 31.10.2026.

